<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股個股分析總覽｜yokim888</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E121A;
    --panel: #161B26;
    --ink: #EDEAE0;
    --ink-dim: #9AA3B2;
    --gold: #C9A227;
    --teal: #1B7A6B;
    --coral: #E2574C;
    --border: rgba(237,234,224,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    line-height: 1.7;
  }
  h1 { font-family: 'Noto Serif TC', serif; }
  header {
    padding: 56px 6vw 36px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    letter-spacing: .12em;
    font-size: .78rem;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  header h1 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); margin: 0 0 10px; }
  header .sub { color: var(--ink-dim); max-width: 60ch; }
  main { padding: 40px 6vw 80px; max-width: 1100px; margin: 0 auto; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
    text-decoration: none;
    color: var(--ink);
    display: block;
    transition: border-color .2s, transform .2s;
  }
  .card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .card .ticker {
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
    font-size: .82rem;
    letter-spacing: .06em;
  }
  .card h3 { margin: 6px 0 10px; font-family: 'Noto Serif TC', serif; font-size: 1.25rem; }
  .card .date { color: var(--ink-dim); font-size: .82rem; font-family: 'JetBrains Mono', monospace; }
  .card .type-tag {
    display: inline-block; margin-top: 10px;
    font-size: .72rem; padding: 2px 10px; border-radius: 20px;
    border: 1px solid var(--teal); color: var(--teal);
  }
  .empty-note { color: var(--ink-dim); padding: 40px 0; }
  footer {
    padding: 24px 6vw 50px; color: var(--ink-dim); font-size: .8rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">TW STOCK ANALYSIS ARCHIVE</div>
  <h1>台股個股分析總覽</h1>
  <p class="sub">依「現金流優先、基本面在後」六步驟框架產出的個股分析報告存放庫。</p>
</header>

<main>
  <div id="report-grid" class="grid"></div>
  <p id="empty-note" class="empty-note" style="display:none;">目前尚無報告，等分析完成後會自動出現在這裡。</p>
</main>

<footer>
  台股個股初步分析框架（tw-stock-initial-analysis）產出成果存放庫｜本站報告為分析方法論輔助工具，不構成投資建議。
</footer>

<script>
  const REPORTS = [
    {
      ticker: "2330",
      name: "台積電",
      title: "台積電（2330）個股初步分析報告",
      file: "reports/2330_tsmc_analysis.html",
      date: "2026-08-18",
      type: "analysis"
    }
  ];

  const grid = document.getElementById('report-grid');
  const emptyNote = document.getElementById('empty-note');

  if (REPORTS.length === 0) {
    emptyNote.style.display = 'block';
  } else {
    REPORTS.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(r => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = r.file;
      a.innerHTML = `
        <div class="ticker">${r.ticker}</div>
        <h3>${r.name}</h3>
        <div class="date">${r.date}</div>
        <span class="type-tag">${r.type === 'special' ? '特別事件' : '個股分析'}</span>
      `;
      grid.appendChild(a);
    });
  }
</script>

</body>
</html>
